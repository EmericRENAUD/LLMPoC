# ESO token source
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token

---
# Secret Kong contenant la clef API stockée dans le vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alice-key-auth
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alice-key-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          konghq.com/credential: key-auth
      data:
        key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: kong/alice
        property: key
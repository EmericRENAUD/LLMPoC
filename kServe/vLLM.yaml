# vLLM (backend CPU) + meta-llama/Llama-3.2-1B-Instruct sur KServe (mode serverless).
#
# Prérequis : le modèle est "gated" sur Hugging Face. Il faut avoir accepté la licence
# Llama 3.2 sur https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct puis disposer
# d'un token HF (le script crée le Secret `hf-secret` à partir de $HF_TOKEN).

# Le token HF est lu depuis le Secret `hf-secret` (clé HF_TOKEN) via une env var
# déclarée dans l'InferenceService ; KServe la transmet au storage-initializer.

# --- Runtime vLLM CPU ------------------------------------------------------------
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cpu
spec:
  supportedModelFormats:
    - name: huggingface
      version: "1"
      autoSelect: false
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
  containers:
    - name: kserve-container
      image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:latest
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - --model=/mnt/models
        - --served-model-name=llama-3.2-1b-instruct
        - --host=0.0.0.0
        - --port=8080
        - --dtype=bfloat16
        - --max-model-len=4096
      env:
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "2"
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      ports:
        - containerPort: 8080
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 10
        failureThreshold: 60
---
# --- InferenceService ------------------------------------------------------------
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-3-2-1b
  annotations:
    serving.kserve.io/deploymentMode: Knative
spec:
  predictor:
    serviceAccountName: hf-sa
    minReplicas: 1       
    maxReplicas: 1
    timeout: 600          
    model:
      modelFormat:
        name: huggingface
      runtime: vllm-cpu
      storageUri: hf://meta-llama/Llama-3.2-1B-Instruct
      resources:
        requests:
          cpu: "4"
          memory: 6Gi
        limits:
          cpu: "4"
          memory: 8Gi
---
# --------- Secret ------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: hf-secret
type: Opaque
stringData:
  HF_TOKEN: "REPLACE_WITH_TOKEN"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hf-sa
secrets:
  - name: hf-secret
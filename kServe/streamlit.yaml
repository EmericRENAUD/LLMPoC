apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  labels:
    app: streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
        - name: streamlit
          # Image construite en local puis chargée dans minikube (voir les commandes)
          image: my-streamlit
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          env:
            # Service Knative du LLM (namespace "default" ; adaptez si besoin)
            - name: VLLM_BASE_URL
              value: http://llama-3-2-1b-predictor.default.svc.cluster.local/v1
            - name: MODEL_NAME
              value: llama-3.2-1b-instruct
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
spec:
  selector:
    app: streamlit
  ports:
    - name: http
      port: 80
      targetPort: http